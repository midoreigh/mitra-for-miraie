name: CI

# Pull requests only: main only changes through them, so a run after merging would repeat
# one that just passed. Run it by hand from the Actions tab if needed.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The apps are only built for release-prep pull requests and by hand; features are built
  # locally and tested before merging, and tags build the releases. The Mac and Android apps
  # are versioned and released separately, so each release PR builds only its own app:
  # release/android-<version> builds Android, any other release/<version> builds macOS.
  changes:
    name: Decide whether to build
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.decide.outputs.macos }}
      android: ${{ steps.decide.outputs.android }}
    steps:
      - id: decide
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          macos=false android=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            macos=true android=true
          elif [[ "$BRANCH" == release/android-* ]]; then
            android=true
          elif [[ "$BRANCH" == release/* ]]; then
            macos=true
          fi
          echo "macos=$macos" >> "$GITHUB_OUTPUT"
          echo "android=$android" >> "$GITHUB_OUTPUT"

  # Required by branch protection. When skipped, GitHub counts it as passed.
  macos:
    name: macOS build and test
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Test MitraKit
        working-directory: macOS/Packages/MitraKit
        run: swift test

      - name: Build the app
        working-directory: macOS
        run: >
          xcodebuild -project Mitra.xcodeproj -scheme Mitra
          -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO build

  android:
    name: Android build and test
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Test and build
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug
