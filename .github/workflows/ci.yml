name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Test MitraKit
        working-directory: macOS/Packages/MitraKit
        run: swift test

      - name: Build the app
        working-directory: macOS
        run: >
          xcodebuild -project Mitra.xcodeproj -scheme Mitra
          -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO build
