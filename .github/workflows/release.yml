name: Release

# The Mac and Android apps are released separately: a vN.N.N tag releases the Mac app and an
# android-vN.N.N tag (e.g. android-v1.0.0-rc.1) the Android app.
on:
  push:
    tags: ['v*', 'android-v*']

permissions:
  contents: write

jobs:
  macos:
    name: Build and publish the macOS DMG
    if: startsWith(github.ref_name, 'v')
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      # The self-signed certificate that gives every release the same designated requirement.
      # (macOS still asks for the keychain password after updates: without a Team ID it ties
      # keychain items to each build.) Kept in the repository secrets.
      - name: Import the signing certificate
        env:
          CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Build the DMG
        env:
          SIGN_IDENTITY: Mitra for MirAIe
        run: macOS/scripts/release.sh "${GITHUB_REF_NAME#v}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Who it's for, this version's section of the changelog, then how to install.
          cp .github/release-header.md notes.md
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[|^\[/ {on=0} on' CHANGELOG.md >> notes.md
          cat .github/release-install.md >> notes.md
          gh release create "$GITHUB_REF_NAME" \
            macOS/build/release/Mitra-for-MirAIe-$version.dmg \
            macOS/build/release/Mitra-for-MirAIe-$version.dmg.sha256 \
            --title "Mitra for Mac $version" --notes-file notes.md

  android:
    name: Build and publish the Android APK
    if: startsWith(github.ref_name, 'android-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Check the tag matches the app's version
        run: |
          version="${GITHUB_REF_NAME#android-v}"
          grep -q "versionName = \"$version\"" android/app/build.gradle.kts ||
            { echo "::error::android/app/build.gradle.kts doesn't have versionName \"$version\""; exit 1; }

      # The permanent release key: every release must be signed with it, or Android won't
      # install it as an update. Kept in the repository secrets.
      - name: Build the APK
        working-directory: android
        env:
          KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
          MITRA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "::error::The ANDROID_SIGNING_KEYSTORE secret is missing"; exit 1; }
          export MITRA_ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE" | base64 --decode > "$MITRA_ANDROID_KEYSTORE"
          ./gradlew testDebugUnitTest assembleRelease
          rm "$MITRA_ANDROID_KEYSTORE"
          version="${GITHUB_REF_NAME#android-v}"
          apk="Mitra-for-MirAIe-$version.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          shasum -a 256 "$apk" > "$apk.sha256"

      # Never marked latest: the Mac app's updater reads the latest release. Versions with a
      # suffix (-rc.1, -beta.2) are published as pre-releases.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#android-v}"
          cp .github/release-header-android.md notes.md
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[|^\[/ {on=0} on' android/CHANGELOG.md >> notes.md
          cat .github/release-install-android.md >> notes.md
          prerelease=""
          [[ "$version" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" \
            "android/Mitra-for-MirAIe-$version.apk" "android/Mitra-for-MirAIe-$version.apk.sha256" \
            --title "Mitra for Android $version" --notes-file notes.md \
            --latest=false $prerelease
